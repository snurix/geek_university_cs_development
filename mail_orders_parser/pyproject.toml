[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-orders-parser"
version = "0.1.0"
description = "Mail orders parser service"
authors = [{ name = "", email = "" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = ["ipython"]

[project.urls]
Homepage = "https://example.com"

[tool.setuptools]
packages = ["mail_orders_parser", "mail_orders_parser.app"]
